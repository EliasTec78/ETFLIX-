name: Atualizar ETFlix.m3u

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # Executa todos os dias às 12h UTC

jobs:
  atualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Ler link atual
        id: link_atual
        run: |
          echo "url_m3u=$(cat ETF/link_m3u.txt)" >> $GITHUB_OUTPUT

      - name: Verificar se link anterior existe
        run: |
          if [ ! -f ETF/link_anterior.txt ]; then
            echo "Primeira execução. Criando arquivo link_anterior.txt..."
            echo "${{ steps.link_atual.outputs.url_m3u }}" > ETF/link_anterior.txt
          fi

      - name: Comparar link com anterior
        id: comparar
        run: |
          anterior=$(cat ETF/link_anterior.txt)
          atual="${{ steps.link_atual.outputs.url_m3u }}"
          if [ "$anterior" != "$atual" ]; then
            echo "atualizar=true" >> $GITHUB_OUTPUT
          else
            echo "atualizar=false" >> $GITHUB_OUTPUT

      - name: Baixar nova lista M3U
        if: steps.comparar.outputs.atualizar == 'true'
        run: |
          curl -L "${{ steps.link_atual.outputs.url_m3u }}" -o ETF/ETFlix.m3u
          echo "${{ steps.link_atual.outputs.url_m3u }}" > ETF/link_anterior.txt

      - name: Commitar alterações
        if: steps.comparar.outputs.atualizar == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ETF/ETFlix.m3u ETF/link_anterior.txt
          git commit -m "Atualizando ETFlix.m3u automaticamente"
          git push

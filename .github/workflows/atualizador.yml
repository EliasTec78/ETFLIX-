name: Atualizar ETFlix.m3u

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # A cada 6 horas

jobs:
  atualizar-lista:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v3

      - name: Instalar curl
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Ler link atual e anterior
        id: links
        run: |
          LINK_ATUAL=$(cat link_m3u.txt)
          echo "Link atual: $LINK_ATUAL"
          if [ -f link_anterior.txt ]; then
            LINK_ANTERIOR=$(cat link_anterior.txt)
            echo "Link anterior: $LINK_ANTERIOR"
          else
            LINK_ANTERIOR=""
            echo "link_anterior.txt não existe ainda."
          fi
          echo "link_atual=$LINK_ATUAL" >> $GITHUB_OUTPUT
          echo "link_anterior=$LINK_ANTERIOR" >> $GITHUB_OUTPUT

      - name: Verificar se link mudou
        if: steps.links.outputs.link_atual != steps.links.outputs.link_anterior
        run: |
          echo "Novo link detectado. Baixando arquivo..."
          curl -L "${{ steps.links.outputs.link_atual }}" --output ETF/ETFlix.m3u
          echo "${{ steps.links.outputs.link_atual }}" > link_anterior.txt

      - name: Commit e push se houve mudanças
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git diff --quiet; then
            echo "Nenhuma alteração detectada."
          else
            git add ETF/ETFlix.m3u link_anterior.txt
            git commit -m "Atualização automática do ETFlix.m3u"
            git push

name: Atualizar ETFlix_list

on:
  schedule:
    - cron: '0 */6 * * *'  # Executa a cada 6 horas
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v3

      - name: Configurar Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Ler link atual
        id: link
        run: |
          LINK_ATUAL=$(cat link_m3u.txt)
          echo "Link atual: $LINK_ATUAL"

          if [ -f link_anterior.txt ]; then
            LINK_ANTERIOR=$(cat link_anterior.txt)
          else
            LINK_ANTERIOR=""
          fi

          echo "Link anterior: $LINK_ANTERIOR"

          if [ "$LINK_ATUAL" != "$LINK_ANTERIOR" ]; then
            echo "link_modificado=true" >> $GITHUB_ENV
            echo "$LINK_ATUAL" > link_anterior.txt
          else
            echo "link_modificado=false" >> $GITHUB_ENV
          fi

      - name: Baixar novo arquivo M3U
        if: env.link_modificado == 'true'
        run: |
          mkdir -p public/ETFlix_list
          LINK=$(cat link_m3u.txt)
          echo "Baixando a lista de: $LINK"
          curl -L "$LINK" -o public/ETFlix_list/ETFlix_list.m3u

      - name: Commit e push se houver mudanças
        if: env.link_modificado == 'true'
        run: |
          git add public/ETFlix_list/ETFlix_list.m3u link_anterior.txt
          git commit -m "Atualização automática da lista ETFlix"
          git push

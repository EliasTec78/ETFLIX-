name: Atualizar lista M3U original

on:
  schedule:
    - cron: '0 12 * * *'   # Executa diariamente às 12h UTC
  workflow_dispatch:

jobs:
  baixar-e-substituir:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Baixar lista M3U usando link do arquivo
        run: |
          LINK=$(cat link_m3u.txt)
          echo "Baixando a lista de: $LINK"
          curl -L "$LINK" -o ETFlix_list/ETFlix_list.m3u

      - name: Commit e push da lista atualizada
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add ETFlix_list/ETFlix_list.m3u
          git diff --cached --quiet || git commit -m "Atualização automática da lista M3U"
          git push

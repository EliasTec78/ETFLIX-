name: Atualizar ETFlix_list

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # Executa a cada hora

jobs:
  atualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Configurar Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Criar pasta public/ETFlix_list se não existir
        run: mkdir -p public/ETFlix_list

      - name: Ler link atual
        id: ler_link
        run: |
          LINK=$(cat link_m3u.txt)
          echo "link_atual=$LINK" >> $GITHUB_ENV

      - name: Comparar com link anterior
        id: comparar
        run: |
          LINK_ANTERIOR=$(cat link_anterior.txt 2>/dev/null || echo "")
          if [ "$LINK_ANTERIOR" != "$link_atual" ]; then
            echo "mudou=true" >> $GITHUB_ENV
          else
            echo "mudou=false" >> $GITHUB_ENV
          fi

      - name: Baixar nova lista M3U se mudou
        if: env.mudou == 'true'
        run: |
          curl -L --output public/ETFlix_list/ETFlix_list.m3u "$link_atual"
          echo "$link_atual" > link_anterior.txt

      - name: Commit e Push
        if: env.mudou == 'true'
        run: |
          git add public/ETFlix_list/ETFlix_list.m3u link_anterior.txt
          git commit -m "Atualizar lista M3U"
          git push

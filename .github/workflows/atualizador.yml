name: Atualizar ETFlix.m3u

on:
  push:
    paths:
      - link_m3u.txt
  schedule:
    - cron: '0 10 * * *'  # Todos os dias às 10h UTC
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Ler o link atual
        id: link_atual
        run: |
          link=$(cat link_m3u.txt)
          echo "url_m3u=$link" >> $GITHUB_OUTPUT

      - name: Comparar com o link anterior
        id: comparar
        run: |
          if [ -f link_anterior.txt ]; then
            anterior=$(cat link_anterior.txt)
          else
            anterior=""
          fi

          atual="${{ steps.link_atual.outputs.url_m3u }}"

          if [ "$anterior" != "$atual" ]; then
            echo "atualizar=true" >> $GITHUB_OUTPUT
          else
            echo "atualizar=false" >> $GITHUB_OUTPUT
          fi

      - name: Baixar e substituir arquivo m3u
        if: steps.comparar.outputs.atualizar == 'true'
        run: |
          curl -L "${{ steps.link_atual.outputs.url_m3u }}" --output ETF/ETFlix.m3u
          echo "${{ steps.link_atual.outputs.url_m3u }}" > link_anterior.txt

      - name: Commit e Push
        if: steps.comparar.outputs.atualizar == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ETF/ETFlix.m3u link_anterior.txt
          git commit -m "Atualiza ETFlix.m3u com nova lista"
          git push

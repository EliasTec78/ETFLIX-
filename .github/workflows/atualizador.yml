name: Atualizar lista M3U original

on:
  schedule:
    - cron: '0 12 * * *'   # Executa diariamente às 12h UTC
  workflow_dispatch:

jobs:
  baixar-e-substituir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Baixar arquivo M3U original
        run: |
          curl -L "http://invictosplay.pro/get.php?username=384707115936&password=378601443249&type=m3u_plus&output=mpegts" -o listaETflix.m3u

      - name: Commit e push da nova versão
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add listaETflix.m3u
          if git diff --cached --quiet; then
            echo "Sem mudanças, não precisa commitar."
          else
            git commit -m "Atualização automática da lista M3U original"
            git push

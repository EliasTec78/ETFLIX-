name: Atualizar lista M3U original

on:
  schedule:
    - cron: '0 12 * * *'   # Executa diariamente às 12h UTC
  workflow_dispatch:

jobs:
  baixar-e-substituir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Ler link do arquivo e baixar lista
        run: |
          LINK=$(cat link_m3u.txt)
          echo "Baixando lista a partir de: $LINK"
          curl -L "$LINK" -o ETFlix_list.m3u

      - name: Commit e push da nova versão
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ETFlix_list.m3u
          if git diff --cached --quiet; then
            echo "Sem mudanças na lista."
          else
            git commit -m "Atualização automática da lista M3U original"
            git push
